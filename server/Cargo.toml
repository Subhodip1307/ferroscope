[package]
name = "ferroscope-server"
version = "2.2.0"
edition = "2024"

[profile.release]
lto="fat"
codegen-units=1
panic="abort"
strip=true

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio","postgres","macros","uuid","chrono","time"] }
axum = "0.8.8"
serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4.43", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors"] }
argon2 = "0.5.3"
password-hash = "0.5.0"
rand = "0.8.0"
dashmap = "6.1.0"
tokio-stream = { version = "0.1.18", features = ["sync"] }
futures-util = "0.3.32"
mini-moka = "0.10.3"
time = { version = "0.3", features = ["serde"] } 
lettre = {version = "0.11.20", default-features = false,features = ["tokio1-rustls-tls", "smtp-transport", "builder","pool"] }
reqwest = { version = "0.12", default-features = false,features = ["json", "rustls-tls-webpki-roots"] }
serde_json = "1.0.149"
base64 = "0.23.0"
form_urlencoded = "1.2.2"

[features]
disable_auth=[]

[[bin]]
name="ferroscope-server"
path="src/main.rs"

[[bin]]
name="fero"
path="src/bin/fero.rs"
